<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07131f">
  <title>Totus Central</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="login" class="login-screen">
    <main class="login-card" aria-labelledby="loginTitle">
      <div class="brand">TOTUS <span>CENTRAL</span></div>
      <h1 id="loginTitle">Acceso al equipo</h1>
      <p class="muted">Una única herramienta para jornada, tareas, compras, precios y gestión interna.</p>
      <form id="loginForm" novalidate>
        <label>Email<input id="loginEmail" type="email" autocomplete="email" inputmode="email" required></label>
        <label>Contraseña<div class="password-row"><input id="loginPassword" type="password" autocomplete="current-password" required><button id="togglePassword" type="button" class="icon-btn" aria-label="Mostrar contraseña">Ver</button></div></label>
        <div id="loginStatus" class="form-status" role="status" aria-live="polite"></div>
        <button id="loginSubmit" type="submit" class="primary wide">Entrar</button>
      </form>
      <button id="forgotPassword" type="button" class="link-btn">He olvidado mi contraseña</button>
    </main>
  </div>

  <div id="app" class="app-shell hidden">
    <aside id="sidebar" class="sidebar" aria-label="Menú principal">
      <div class="brand sidebar-brand">TOTUS <span>CENTRAL</span></div>
      <nav id="mainNav" class="main-nav"></nav>
      <div class="sidebar-foot">
        <div id="userMini" class="user-mini"></div>
        <button id="logoutBtn" class="secondary wide" type="button">Salir</button>
      </div>
    </aside>
    <div id="navBackdrop" class="nav-backdrop"></div>
    <section class="workspace">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Abrir menú">☰</button>
        <div><div id="viewEyebrow" class="eyebrow">Totus Central</div><h1 id="viewTitle">Mi panel</h1></div>
        <div class="topbar-actions"><span id="roleChip" class="chip"></span><span id="locationChip" class="chip"></span></div>
      </header>
      <section id="workDock" class="work-dock" aria-label="Estado de jornada"></section>
      <nav id="subNav" class="subnav" aria-label="Secciones"></nav>
      <main id="content" class="content" tabindex="-1"></main>
    </section>
  </div>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <div id="modalHost"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
