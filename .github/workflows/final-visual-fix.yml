name: Final visual corrections

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run final visual corrections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply remaining Chromium findings to single shell
        shell: bash
        run: |
          set -euo pipefail
          cat >> totus-shell.css <<'CSS'

          /* Browser QA · cierre de incidencias restantes */
          #main .schedule-time-field>span{font-size:10px!important;line-height:1.35!important}
          @media(max-width:760px){
            #main .card:has(> .section-head + .list .task-card),
            #main .card:has(> .purchase-form){display:contents!important}
            #main .card:has(> .section-head + .list .task-card)>.section-head{margin:12px 0 8px;padding:0 2px}
            #main .card:has(> .purchase-form)>.section-head{margin:12px 0 6px;padding:0 2px}
            #main .purchase-form{display:grid;gap:10px}
            #main .purchase-form .form-section{margin-top:0!important}
            #main .task-card{margin-bottom:8px}
          }
          CSS
          rm .github/workflows/final-visual-fix.yml
          git config user.name 'hortimatic'
          git config user.email 'hortimatic@gmail.com'
          git add -A
          git commit -m 'Close remaining Chromium visual findings'
          git push origin HEAD:main
