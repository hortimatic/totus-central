name: Totus Clean QA
on:
  push:
    branches: [clean-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find src qa -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Structural QA
        run: node qa/clean-qa.mjs
      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Visual QA desktop tablet mobile
        run: node qa/visual-clean-qa.mjs
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: totus-clean-qa
          path: qa-artifacts/
          retention-days: 7